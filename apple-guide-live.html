<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17805a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apple Guide">
<title>Kashmir Apple Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f1ec;--card:#fafaf7;--ink:#1d2a24;--mut:#6b7872;--line:#e4e6df;--green:#17805a;--on:#fff;--orange:#f4a261;--tb:#d9eef1;--tp:#f6dcd8;--ok:#dff1e7;--wait:#fbefd2;--stop:#f9dedb;--sh:0 10px 28px rgba(40,55,45,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(16px*var(--fs,1))}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--ink:#e8efe9;--mut:#93a39a;--line:#26332c;--green:#3fc592;--on:#06261a;--tb:#1b3a40;--tp:#40262a;--ok:#1b3322;--wait:#3a3216;--stop:#3d1d1e;--sh:none}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--ink:#e8efe9;--mut:#93a39a;--line:#26332c;--green:#3fc592;--on:#06261a;--tb:#1b3a40;--tp:#40262a;--ok:#1b3322;--wait:#3a3216;--stop:#3d1d1e;--sh:none}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 "Plus Jakarta Sans",system-ui,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:1.7rem;font-weight:800;margin:0;line-height:1.15}h2{font-size:1.35rem;font-weight:800;margin:2px 0;line-height:1.2}h3{font-size:1.05rem;font-weight:800;margin:0 0 8px}
.m{color:var(--mut);margin:4px 0;font-size:.92rem}
.anim>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.card,.sec,.hero,details{background:var(--card);border-radius:24px;padding:18px;margin-top:14px;box-shadow:var(--sh)}
.gr{display:flex;align-items:center;justify-content:space-between}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer}.round svg{width:26px;height:26px}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:4px 16px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border:0;border-radius:999px;background:var(--line);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;transition:background .25s,transform .15s}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover}.chip.on{background:var(--orange);color:#2a1a08}
.stage{padding:0;overflow:hidden}.stage img{width:100%;height:190px;object-fit:cover;display:block;animation:ph .7s ease both}
@keyframes ph{from{opacity:0;transform:scale(1.06)}}
.stage .tx,.hero .tx{padding:16px 18px 18px}.lead{margin:6px 0 14px}
.hero{padding:0;overflow:hidden}.hero img{width:100%;height:auto;display:block}
.btn{width:100%;min-height:50px;border:0;border-radius:999px;background:var(--green);color:var(--on);font:inherit;font-weight:700;cursor:pointer;transition:transform .15s}
.btn.alt{background:transparent;color:var(--green);border:2px solid var(--green)}
button:active{transform:scale(.97)}
.wh{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:40px;width:auto;padding:0 14px;border-radius:999px;border:0;background:var(--line);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pill.alt{background:transparent;border:2px solid var(--line)}
.wt{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.big{font-size:2.8rem;font-weight:800;line-height:1}.wi{width:72px;height:72px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.mets div{display:flex;flex-direction:column;align-items:center;gap:2px}.mets b{font-size:.95rem}.mets span{color:var(--mut);font-size:.78rem}
.mi{width:24px;height:24px;fill:none;stroke:var(--mut);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sun{display:flex;flex-direction:column;align-items:center;margin-top:8px}.sun svg{width:100%;max-width:300px}
.sun div{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:.85rem;color:var(--mut)}
.arc{fill:none;stroke:var(--mut);stroke-width:1.6;stroke-dasharray:4 5}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{border-radius:22px;padding:14px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;color:#1d2a24}
.tile b{font-size:2rem;font-weight:800;line-height:1}.tile>span{font-size:.82rem}
.tile.g{background:#17805a;color:#fff}.tile.b{background:var(--tb);color:var(--ink)}.tile.p{background:var(--tp);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:560px){.two{grid-template-columns:1fr 1fr;gap:14px}}
.ring{display:flex;align-items:center;gap:16px}.ring svg{width:110px;height:110px;flex:none}.ring b{display:block;font-size:1.8rem;font-weight:800}.ring span{color:var(--mut)}
.rb{fill:none;stroke:var(--line);stroke-width:12}.rp{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;animation:ring 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:var(--full)}}
.cyls{display:flex;justify-content:space-around;gap:6px;text-align:center}.cyls b{display:block;font-size:.95rem;margin-top:8px}.cyls span{color:var(--mut);font-size:.78rem}
.cyl{position:relative;width:60px;height:100px;margin:0 auto;border-radius:18px/12px;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 45%,rgba(0,0,0,.05));border:1.5px solid var(--line)}
.cyl i{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:linear-gradient(90deg,#58b0d1,#2f80a8);animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*140ms + 300ms)}
@keyframes fill{from{height:0}}
.cyl:after{content:"";position:absolute;top:0;left:0;right:0;height:16px;border-radius:50%;background:rgba(255,255,255,.35)}
.sk{border-radius:16px;background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.pn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.pn button{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.sec p{margin:6px 0 8px}
.rw{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}.rw b{white-space:nowrap}
.call{border-radius:20px;background:var(--stop);padding:14px 16px;margin-top:14px}
label{display:block;font-weight:700;margin:14px 0 4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;font:inherit;background:var(--bg);color:var(--ink)}
.verdict{padding:18px;border-radius:24px;margin-top:14px}.go{background:var(--ok)}.wait{background:var(--wait)}.stop{background:var(--stop)}
.rw small{display:block;color:var(--mut);font-size:.8rem}.rw.skip{opacity:.45}.dz{text-align:right;flex:0 0 40%}.dz b{white-space:normal}
.set{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.set b{display:block}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;border-radius:999px;min-height:40px;cursor:pointer}.seg button.on{background:var(--green);color:var(--on)}
.nohint .hi{display:none}.calm *,.calm *:before,.calm *:after{animation:none!important;transition:none!important}
.why{padding:11px 4px;border-top:1px solid var(--line)}
.ent{padding:14px 0;border-top:1px solid var(--line)}
.x{margin-top:8px;min-height:40px;padding:0 16px;border-radius:999px;border:2px solid #c0392b;background:none;color:#c0392b;font:inherit;font-weight:600;cursor:pointer}
summary{cursor:pointer;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:7px 0;border-top:1px solid var(--line)}td+td{text-align:right;font-weight:700}
ul{padding-left:20px;margin:8px 0}li{margin:5px 0}
.foot{margin-top:30px;color:var(--mut);font-size:.82rem}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;display:flex;background:var(--card);border-radius:28px;box-shadow:0 12px 32px rgba(30,45,38,.18);padding:8px 6px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:.74rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;transition:color .2s}
.tabs button.on{color:var(--green)}.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}.tabs button.on svg{transform:translateY(-2px) scale(1.12)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

{n:1,t:"Delayed dormancy",ni:"Apply before green tip:",i:"Horticultural mineral oil (2 L)",c:"Prune and train, keep the orchard clean, ensure drainage, stake young trees."},

function advise(s,rain,hot,wet,gap){
  const o=[],add=(c,m)=>o.push([c,m]);
  if(s===5)rain&&gap>=10?add("wait","Flowering: spraying is not advisable. The guide allows a fungicide only if 10 days have passed since the last one and rain is forecast. Spray in mist form."):add("stop","Flowering: do not spray. Spraying is not advisable during flowering.");
  else if(s===2||s===3)rain?add("go","Rain is coming. Spray a listed fungicide before the rain starts."):add("stop","Dry for 7 days. The guide says do not spray fungicide now.");
  else if(s===4)rain?add("go","Spray a listed fungicide before the rain. This is the key stage for primary scab."):add("wait","Dry weather. Spray when most flowers are at pink stage, not in early flowering.");
  else if(s>=6&&s<=10)rain?add("go","Rain is forecast. Spray a listed fungicide before the rain."):add("wait","No rain forecast. The guide schedules fungicide before rains. Use insect or mite sprays only when the counts in the stage are reached.");
  else if(s===11)add("wait","Spray only if scab, Alternaria leaf blotch, sooty blotch or fly speck is present. Avoid spraying right after heavy rain, especially at low altitude.");
  else if(s===12)add("wait","Spray only if needed for storage, and check the waiting period first (see the warning on the Sprays page).");
  else add("wait","The guide lists no fungicide for this stage.");
  if(hot)add("wait","High temperature: do not spray in the heat. Spray in the early morning or evening.");
  if(wet)add("wait","Rainy or wet weather: avoid spraying. It can burn the leaves, especially in Stage 10.");
  add("wait","If heavy rain falls within 12 hours after spraying, repeat the spray (when no sticker or adjuvant was used). Never spray in full bloom.");
  return [o.some(x=>x[0]==="stop")?"stop":(hot||wet)?"wait":o.some(x=>x[0]==="go")?"go":"wait",o];
}

  const unk=["zineb","carbendazim","sulphur"].filter(k=>q.includes(k)),dy=w+(w===1?" day":" days");
  const note=same?"Skip: same as your last spray":w===null?"Waiting period: check the label":s===12&&w>20?"Waiting period "+dy+" is longer than this stage’s 15–20 days. Ask an expert first.":unk.length?"At least "+dy+". The guide’s table does not list "+unk.join(" or ")+", so check the label.":"Waiting period "+dy;

}

  let h="";

  else if(s===11)h+=prob==="scab"?blk("Fungicide for scab or Alternaria leaf blotch",S.fn,S.f):prob==="sooty"?blk("Fungicide for sooty blotch or fly speck",S.ni,S.i):msg("Fungicide","Stage 11 sprays are only for scab, Alternaria leaf blotch, sooty blotch or fly speck. Choose what you see in the orchard above.");
  else if(S.f)h+=can?blk("Fungicide",S.fn,S.f):(prob==="scab"&&s!==5)?blk("Fungicide for the scab you see",(S.fn||"")+" Spray when the weather allows, not in heat or rain.",S.f):msg("Fungicide","No fungicide is scheduled by the guide today. It lists these only before rain.");
  if(prob==="insects"&&s!==1&&S.i&&s!==11)h+=blk("Insecticide (need based)",S.ni,S.i);
  if(prob==="mites"&&s!==11){
    const t=MT[s];

    const w=await fetch(await nodeUrl(),{method:"PUT",body:JSON.stringify({diary:D,tomb:TOMB,profile:PROF})});
    if(!w.ok)throw new Error("DB");
    SYNC="Saved online at "+new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})+".";
  }catch(e){
    if(e.message==="SESSION"){AUTH=null;store("apple-auth",null);SYNC="";render();return}
    SYNC="Could not save online. Your diary is safe on this phone and will sync later.";
  }
  paintAcc();
  const f=document.activeElement;if(tab==="dia"&&!(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName)))render();
}
async function acct(kind){
  const m=t=>{const el=$("acm");if(el)el.textContent=t};
  const mail=$("ac-mail")?$("ac-mail").value.trim():"",pass=$("ac-pass")?$("ac-pass").value:"";
  try{
    if(kind==="login"||kind==="signup"){
      if(!mail||!pass){m("Please enter your email and password.");return}
      m("Please wait…");
      setAuth(await fb(kind==="login"?"signInWithPassword":"signUp",{email:mail,password:pass,returnSecureToken:true}));
      await sync();render();
    }else if(kind==="forgot"){
      if(!mail){m("Enter your email above first.");return}
      await fb("sendOobCode",{requestType:"PASSWORD_RESET",email:mail});m("We sent a password reset link to your email.");
    }else if(kind==="saveprof"){
      PROF={name:$("ac-name").value.trim()};store("apple-profile",PROF);await sync();m("Saved.");
    }else if(kind==="delacc"){
      if(!confirm("Delete your account and your online diary? This cannot be undone."))return;
      await fetch(await nodeUrl(),{method:"DELETE"});await fb("delete",{idToken:await token()});
      AUTH=null;store("apple-auth",null);SYNC="";render();
    }
  }catch(e){m(friendly(e))}
}
function accHTML(){
  if(!ON)return `<div class="set"><div><b>Account</b><span class="m">Accounts are coming soon. Your diary is saved on this phone for now.</span></div></div>`;
  if(AUTH)return `<div class="set"><div><b>Account</b><span class="m" id="acs">Signed in as ${esc(AUTH.email)}. ${esc(SYNC)}</span></div>
  <label for="ac-name">Your name</label><input id="ac-name" value="${esc(PROF.name)}" autocomplete="name">
  <div class="wh"><button class="pill" data-a="saveprof">Save name</button><button class="pill alt" data-a="syncnow">Save diary online now</button><button class="pill alt" data-a="logout">Log out</button></div>
  <p class="m">Your spray diary is saved online, so you keep it if you change phones. Logging out keeps a copy on this phone. Use Clear spray diary below to remove it.</p>
  <div class="wh"><button class="pill alt" data-a="delacc">Delete my account and online data</button></div><div id="acm" class="m" role="status"></div></div>`;
  return `<div class="set"><div><b>Account</b><span class="m">Optional. An account keeps your spray diary safe online so you can use it on another phone. We store only your email, your name and your spray diary.</span></div>
  <label for="ac-mail">Email</label><input id="ac-mail" type="email" autocomplete="email">
  <label for="ac-pass">Password (at least 6 characters)</label><input id="ac-pass" type="password" autocomplete="current-password">
  <div class="wh"><button class="pill" data-a="login">Log in</button><button class="pill alt" data-a="signup">Create account</button><button class="pill alt" data-a="forgot">Forgot password</button></div><div id="acm" class="m" role="status"></div></div>`;
}

function render(){
  $("tabs").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-tab="${t[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
  const v=$("v");v.className=ANIM?"anim":"";
  v.innerHTML=topBanners()+({stage:homeView,spr:sprView,wx:wxView,dia:diaView,learn:learnView}[tab])()+FOOT;
  [...v.children].forEach((c,i)=>c.style.setProperty("--i",Math.min(i,8)));
  if(tab==="stage"||tab==="wx"){fillWx();ensureWx()}
  const on=document.querySelector(".chip.on"),sp=$("strip");
  if(on&&sp)sp.scrollLeft=on.offsetLeft-sp.clientWidth/2+on.clientWidth/2;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-s],[data-g],[data-a],[data-set],[data-jump]");
  if(!t)return;
  const d=t.dataset;
  if(d.jump){const el=$(d.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  ANIM=!!(d.tab||d.g);
  if(d.tab||d.g){tab=d.tab||d.g;window.scrollTo(0,0);if(tab==="dia"&&AUTH)sync()}
  else if(d.s){setCur(+d.s);if(tab==="spr"){ANIM=true;window.scrollTo(0,0)}}
  else if(d.set){const k=d.set,v=d.v;SET[k]=k==="size"?+v:(k==="hint"||k==="calm")?v==="1":v;saveSet();applySet()}
  else if(d.a==="forgetplace"){PLACE=null;WX=null;try{localStorage.removeItem("apple-place")}catch(x){}}
  else if(d.a==="cleardiary"){if(!confirm("Delete all your saved sprays?"))return;D.forEach(g=>g.id&&TOMB.push(g.id));store("apple-tomb",TOMB);D=[];saveD();if(AUTH)sync()}
  else if(d.a==="resetset"){if(!confirm("Reset all settings?"))return;SET={...DEF};TANK=SET.tank;saveSet();applySet()}
  else if(["login","signup","forgot","saveprof","delacc"].includes(d.a)){acct(d.a);return}
  else if(d.a==="syncnow"){sync();return}
  else if(d.a==="logout"){AUTH=null;store("apple-auth",null);SYNC=""}
  else if(d.a==="install"){if(INST){INST.prompt();INST.userChoice.then(()=>{INST=null;ANIM=false;render()})}return}
  else if(d.a==="hideinst"){hideInst=true;try{localStorage.setItem("apple-inst","1")}catch(x){}}
  else if(d.a==="gps"){gps();return}
  else if(d.a==="add"){
    const p=$("dp").value.trim();
    if(!p||!$("dd").value){alert("Please enter the date and the product.");return}
    D.unshift({id:"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:$("dd").value,block:$("db").value.trim(),st:$("ds").value,p,dose:$("dq").value.trim(),note:$("dn").value.trim(),d:phi(p)});saveD();if(AUTH)sync();
  }else if(d.a==="del"){
    if(!confirm("Delete this entry?"))return;
    const g=D.splice(+d.i,1)[0];if(g&&g.id){TOMB.push(g.id);store("apple-tomb",TOMB)}saveD();if(AUTH)sync();
  }
  render();
});
document.addEventListener("input",e=>{if(e.target.id==="ws")setCur(+e.target.value);if(e.target.id==="wt"){TANK=Math.max(1,+e.target.value||100);SET.tank=TANK;saveSet()}if(e.target.id==="st-tank"){TANK=SET.tank=Math.max(1,+e.target.value||100);saveSet()}if(e.target.id==="st-heat"){SET.heat=Math.max(1,+e.target.value||30);saveSet()}if(tab==="wx"&&$("wo"))calcW()});
document.addEventListener("change",e=>{if(e.target.id==="wp"&&PL[e.target.value]){ANIM=false;setPlace({name:e.target.value,lat:PL[e.target.value][0],lon:PL[e.target.value][1]});render()}});
render();
if(AUTH)sync();
</script>
