#totop{right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%}
#fbl{left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));height:48px;padding:0 18px;border-radius:999px}
.msg{margin-top:10px;border-radius:14px;padding:10px 14px;font-weight:600;border-left:4px solid var(--line);background:var(--card)}.msg:empty{display:none}
.msg.ok{background:var(--ok);border-left-color:var(--green)}.msg.ok:before{content:"\2713  "}
.msg.err{background:var(--stop);border-left-color:#c0392b}.msg.err:before{content:"! "}
.msg.info{background:none;border-left-color:transparent;padding-left:0;color:var(--mut)}
[aria-invalid="true"]{border:2px solid #c0392b!important}
.pwrap{position:relative}.pwrap input{padding-right:84px}
.pwbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--line);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pwbtn:active{transform:translateY(-50%) scale(.97)}
.pill.danger{background:#c0392b;color:#fff}
dialog.dlg{border:0;border-radius:24px;padding:20px;background:var(--card);color:var(--ink);font:inherit;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(92vw,440px);max-height:85vh}
dialog.dlg::backdrop{background:rgba(10,20,15,.55)}
dialog.dlg p{margin:6px 0 16px}
dialog.srch{width:min(94vw,560px);margin:calc(env(safe-area-inset-top,0px) + 8vh) auto auto}
.srow{display:flex;gap:8px;align-items:center}.srow .pill{flex:none}
.sl{list-style:none;margin:10px 0 0;padding:0;overflow:auto;max-height:60vh}.sl li+li{border-top:1px solid var(--line)}
.sl button{width:100%;text-align:left;background:none;border:0;padding:12px 4px;min-height:48px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}.sl small{display:block;color:var(--mut);font-weight:500}
#faq details{background:none;box-shadow:none;border-radius:0;border-top:1px solid var(--line);padding:0;margin:0}
#faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:10px 0}
#faq summary::-webkit-details-marker{display:none}
#faq summary:after{content:"+";font-size:1.4rem;line-height:1;color:var(--green);flex:none}
#faq details[open] summary:after{content:"\2212"}
#faq details p{margin:0 0 14px}
a:focus-visible,.skiplink:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
@media(hover:hover){
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 16px rgba(23,128,90,.28)}
.btn.alt:hover,.pill:hover,.chip:not(.on):hover,.pwbtn:hover{background:var(--ok)}
.pill.alt:hover{border-color:var(--green)}.pill.danger:hover{background:#a93226}
.round:hover,.pn button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(40,55,45,.18)}
.navrow:hover,.sl button:hover{background:var(--ok)}
.tabs button:hover{color:var(--green)}
.x:hover{background:#c0392b;color:#fff}
.fab:hover{filter:brightness(1.1);transform:translateY(-2px)}
a.lnk:hover{text-decoration:underline}
}
@media print{
#top,.tabs,.fab,#splash,#wbg,.noprint,.pn,.btn,.pill,.chips,.x,dialog,.skiplink,#notice,body::before{display:none!important}
:root,:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb;--ok:#fff;--wait:#fff;--stop:#fff;--sh:none;--green:#0b5c3f}
body{background:#fff;color:#000;font-size:11pt}
main{max-width:none;padding:0}
.card,.sec,.hero,details,.call,.verdict{box-shadow:none;border:1px solid #bbb;border-radius:8px;break-inside:avoid}
.hero img,.stage img{max-height:5cm;width:auto}
.anim>*{animation:none}
a{color:#000}
}
.alerts .al{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:14px;margin-top:8px;border-left:5px solid var(--line)}
.alerts .al b{flex:none;min-width:84px}.alerts .al.stop{background:var(--stop);border-left-color:#c0392b}.alerts .al.wait{background:var(--wait);border-left-color:#d4900a}
#nextcard .nx{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}#nextcard .nx span{color:var(--mut);font-size:.9rem}#nextcard .nx small{color:var(--mut)}
#nextcard p{margin:6px 0}
</style>
